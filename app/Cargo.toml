[package]
name = "lampstand"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = "0.18.2"
dirs = "7.0.0"
eframe = "0.37.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
opt-level = 2
debug = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
